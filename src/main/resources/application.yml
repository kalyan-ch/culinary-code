
spring:
  application:
    name: culinaryCode
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile
            redirect-uri: ${OAUTH_REDIRECT_URI:{baseUrl}/api/login/oauth2/code/{registrationId}}
  profiles:
    active: local
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8090}
  # Behind Vercel's proxy the callback must build its redirect from the forwarded host,
  # not from the backend's own, or Google is handed the wrong redirect_uri.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # Lax is what stands in for CSRF tokens here: the browser won't attach the session
        # cookie to a cross-site POST/PUT/DELETE, and no state-changing endpoint answers GET.
        same-site: lax
        # Overridden to true in prod, where everything is HTTPS.
        secure: ${COOKIE_SECURE:false}
