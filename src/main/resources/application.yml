
spring:
  application:
    name: culinaryCode
  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders keep the app bootable without Google credentials; the sign-in
            # link simply fails if clicked. Set the real values via the environment.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile
            # Must resolve to the FRONTEND origin, not this service's: the callback is what
            # sets the session cookie, and a cookie set on the backend origin is third-party
            # to the app and dropped by Safari. {baseUrl} derives it from the proxy's
            # forwarded headers, which works but is fragile — set OAUTH_REDIRECT_URI
            # explicitly in any deployed environment and register the same value with Google.
            redirect-uri: ${OAUTH_REDIRECT_URI:{baseUrl}/api/login/oauth2/code/{registrationId}}
  profiles:
    active: local
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8090}
  # Behind Vercel's proxy the callback must build its redirect from the forwarded host,
  # not from the backend's own, or Google is handed the wrong redirect_uri.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # Lax is what stands in for CSRF tokens here: the browser won't attach the session
        # cookie to a cross-site POST/PUT/DELETE, and no state-changing endpoint answers GET.
        same-site: lax
        # Overridden to true in prod, where everything is HTTPS.
        secure: ${COOKIE_SECURE:false}
